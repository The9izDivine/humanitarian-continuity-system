[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanitarian-continuity-system"
version = "0.3.0.dev0"
description = "Independent synthetic humanitarian response continuity and dispatch assurance prototype."
readme = "README.md"
requires-python = ">=3.11"
authors = [
{ name = "Ashley Harris" }
]
keywords = [
"humanitarian",
"continuity",
"dispatch",
"assurance",
"synthetic-data",
"disaster-response"
]
classifiers = [
"Development Status :: 2 - Pre-Alpha",
"Intended Audience :: Science/Research",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Programming Language :: Python :: 3.13",
"Operating System :: OS Independent"
]

dependencies = [
"jsonschema>=4.23,<5",
"PyYAML>=6.0,<7"
]

[project.optional-dependencies]
dev = [
"pytest>=8,<10",
"pytest-cov>=5,<7",
"mypy>=1.14,<2",
"ruff>=0.9,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]